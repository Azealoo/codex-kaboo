name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build -w cli
      - run: node cli/dist/codex-kaboo.js --version
      # Only one cell of the matrix: this doesn't need to run 9 times, and next build is slow.
      # This is the only thing that exercises pack-cli.mjs and `next build` at all — neither ran in
      # CI before, so a Vercel deploy could go green while either was broken.
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run build -w web
        env:
          NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          CLERK_SECRET_KEY: sk_test_ci
          CODEX_KABOO_SERVER: https://example.convex.site
